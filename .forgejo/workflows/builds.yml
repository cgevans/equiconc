name: Builds

# Codeberg Forgejo Actions: full CI + release pipeline.
#
# This workflow now owns the release path (PyPI, crates.io, and a
# Forgejo release with all wheels attached). The GitHub workflow at
# .github/workflows/builds.yml is reduced to a CI mirror; do not re-add
# tag triggers there without first disabling the corresponding Codeberg
# jobs.
#
# Note: the Codeberg Generic Packages registry is intentionally NOT used
# as a release mirror. Wheel artifacts are uploaded to the Forgejo
# release page only, and CI artifact retention is kept short, to stay
# under Codeberg's 1.5 GB per-repo storage quota.
#
# Runner expectations (adjust `runs-on:` labels if your runners use
# different ones):
#   - `docker`      : Linux runner that executes jobs inside a container.
#                     Wheel-build jobs use a manylinux container directly
#                     to avoid docker-in-docker for the maturin step.
#                     The manylinux image has no `node`, so a first step
#                     installs Node 20 from NodeSource (Forgejo Actions
#                     invokes JS actions like actions/checkout via node).
#   - `windows`     : Windows host runner (no container). The host PATH
#                     must include `git.exe` and `node.exe`.
#   - `macos-arm64` : Apple Silicon macOS host runner for Python wheel
#                     builds. macOS x86_64 wheels are intentionally
#                     deprecated; Intel users should install from sdist.
#
# Secrets (set in Codeberg → repo → Settings → Actions → Secrets):
#   - PYPI_TOKEN      : required for `python_release` (PyPI does not
#                       accept Codeberg OIDC, so we use a token).
#   - CRATES_IO_TOKEN : required for `rust_release`.
#   - CODECOV_TOKEN   : optional; coverage upload is best-effort and is
#                       currently unwired (see comment in `tests`).
#   - forge.token     : auto-provided by Forgejo (used by
#                       `forgejo-release@v2` and `git-pages/action@v2`).
#
# Caching: wheel-build jobs that run inside the docker runner use named
# host volumes (`equiconc-cargo`, `equiconc-cargo-target`, `equiconc-uv`)
# for cargo registry/index/target persistence. The runner's config.yaml
# must permit these mounts, e.g.:
#
#   container:
#     valid_volumes:
#       - "equiconc-*"
#
# (or `["**"]` to allow any). Existing CI jobs (lint, cargo-deny, web,
# docs, tests, tests-matrix) keep their previous caching strategy
# (Swatinem/rust-cache, setup-uv enable-cache); the volume pattern is
# only required for the new wheel-build jobs.

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths-ignore:
      - CHANGELOG.md
      - README.md
  pull_request:
  workflow_dispatch:
    inputs:
      build_wheels:
        description: "Build Python wheels and sdist without publishing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

# Cancel superseded runs on the same PR. Tag/main pushes have unique
# refs and aren't affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (fmt + clippy + rustdoc)
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:22-bookworm
    steps:
      - uses: https://github.com/actions/checkout@v6
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: https://github.com/Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: cargo clippy --no-default-features (scalar path stays alive)
        run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings
      - name: cargo doc (deny warnings)
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  cargo-deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:22-bookworm
    steps:
      - uses: https://github.com/actions/checkout@v6
      - uses: https://github.com/EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories sources

  web:
    name: Web (wasm build + native tests)
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:22-bookworm
    steps:
      - uses: https://github.com/actions/checkout@v6
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: https://github.com/Swatinem/rust-cache@v2
      - name: Install trunk
        uses: https://github.com/jetli/trunk-action@v0.5.0
        with:
          version: latest
      - name: cargo test (web crate, native)
        run: cargo test -p equiconc-web
      - name: trunk build --release
        working-directory: web
        run: trunk build --release
      - name: Upload dist artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 3

  docs:
    name: Docs (zensical build with executed notebooks)
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:22-bookworm
    steps:
      - uses: https://github.com/actions/checkout@v6
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
      # uv provisions Python (actions/setup-python only ships Ubuntu
      # prebuilts and can't match this Debian-bookworm container).
      - uses: https://github.com/astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # Avoid extractions/setup-just: it internally references
      # extractions/setup-crate without a URL prefix, which the runner
      # resolves against data.forgejo.org. Also avoid just.systems'
      # install.sh here: Codeberg runners currently receive HTTP 401
      # from that endpoint. Install the pinned upstream release asset
      # directly instead.
      - name: Install just
        env:
          JUST_VERSION: "1.50.0"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C "$HOME/.local/bin" just
          chmod +x "$HOME/.local/bin/just"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version
      - run: uv sync --group docs
      - run: just docs
      - name: Upload docs artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 3

  tests:
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:22-bookworm
    steps:
      - uses: https://github.com/actions/checkout@v6
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Set up Rust cache
        uses: https://github.com/Swatinem/rust-cache@v2
      # uv provisions Python (actions/setup-python only ships Ubuntu
      # prebuilts and can't match this Debian-bookworm container).
      - uses: https://github.com/astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      # Avoid extractions/setup-just: it internally references
      # extractions/setup-crate without a URL prefix, which the runner
      # resolves against data.forgejo.org. Also avoid just.systems'
      # install.sh here: Codeberg runners currently receive HTTP 401
      # from that endpoint. Install the pinned upstream release asset
      # directly instead.
      - name: Install just
        env:
          JUST_VERSION: "1.50.0"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C "$HOME/.local/bin" just
          chmod +x "$HOME/.local/bin/just"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      - run: uv sync --dev --no-install-project # special version will be installed by coverage-lcov
      - run: just coverage-python-full
      - run: just coverage-rust
      # Coverage upload to Coveralls is disabled until a manual-service
      # repo is wired up there (Coveralls has no native Codeberg
      # integration). Coverage files are still produced so re-enabling
      # is a one-step change.

  # Lightweight cross-Python smoke tests. The `tests` job above is the
  # source of truth (with coverage) on Linux+3.12; this job covers the
  # matrix corners that ship in the PyPI wheel but are never otherwise
  # exercised: the minimum supported Python (3.10) and the free-threaded
  # interpreter (3.13t). macOS / Windows are validated only at release
  # time via the wheel-build jobs below.
  tests-matrix:
    name: Tests (${{ matrix.label }})
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:22-bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-py3.10
            python-version: "3.10"
            maturin-extra: ""
            cargo-test-extra: ""
          - label: linux-py3.13t
            python-version: "3.13t"
            # abi3-py310 doesn't apply on free-threaded; opt out of the
            # crate default features and turn on `python` explicitly,
            # matching the free-threaded wheel build.
            maturin-extra: "--no-default-features --features python"
            cargo-test-extra: ""
          - label: linux-py3.12-simd
            python-version: "3.12"
            # Smoke test the opt-in `simd` feature end-to-end so a
            # regression in the SIMD path is caught here rather than at
            # release. (lint already runs `cargo clippy --all-features`,
            # but that's compile-only.)
            #
            # `python` has to come along explicitly: the crate's default
            # features are empty (the SIMD-opt-in flip set them to `[]`),
            # so without it maturin sees no PyO3 bindings and falls back
            # to cffi, which then fails because the uv venv has no pip.
            maturin-extra: "--features simd,python"
            cargo-test-extra: "--features simd"
    steps:
      - uses: https://github.com/actions/checkout@v6
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
      # uv provisions Python (actions/setup-python only ships Ubuntu
      # prebuilts and can't match this Debian-bookworm container).
      - uses: https://github.com/astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: cargo test (lib)
        run: cargo test --lib ${{ matrix.cargo-test-extra }}
      - run: uv sync --dev --no-install-project
      - name: Build extension
        run: uv run maturin develop --uv --release ${{ matrix.maturin-extra }}
      - name: pytest
        run: uv run pytest tests/test_equiconc.py -v

  # ----- Wheel and sdist builds -------------------------------------
  # Gated on tag pushes or manual `workflow_dispatch` with
  # `build_wheels=true`. Branch pushes and PRs do not build wheels.

  linux:
    name: Python Linux builds
    if: startsWith(forge.ref, 'refs/tags/') || inputs.build_wheels == 'true'
    needs: [tests, tests-matrix, lint]
    runs-on: docker
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
      volumes:
        - equiconc-cargo:/cache/cargo
        - equiconc-cargo-target:/cache/cargo-target
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/cargo-target
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - name: Install Node.js (manylinux image has no node, but JS actions need it)
        run: |
          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
          dnf install -y nodejs
      - uses: https://github.com/actions/checkout@v6
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Build wheels
        run: |
          PYTHONS="/opt/python/cp310-cp310/bin/python3 \
                   /opt/python/cp311-cp311/bin/python3 \
                   /opt/python/cp312-cp312/bin/python3 \
                   /opt/python/cp313-cp313/bin/python3 \
                   /opt/python/cp314-cp314/bin/python3"
          /opt/python/cp312-cp312/bin/pip install maturin
          /opt/python/cp312-cp312/bin/maturin build --release --out dist \
            --manylinux 2_28 --target ${{ matrix.target }}-unknown-linux-gnu \
            -i $PYTHONS
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
          retention-days: 1

  linux-freethreaded:
    name: Python Linux free-threaded builds
    if: startsWith(forge.ref, 'refs/tags/') || inputs.build_wheels == 'true'
    needs: [tests, tests-matrix, lint]
    runs-on: docker
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
      volumes:
        - equiconc-cargo:/cache/cargo
        - equiconc-cargo-target:/cache/cargo-target
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/cargo-target
    strategy:
      matrix:
        target: [x86_64]
        python-version: ['3.13t', '3.14t']
    steps:
      - name: Install Node.js (manylinux image has no node, but JS actions need it)
        run: |
          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
          dnf install -y nodejs
      - uses: https://github.com/actions/checkout@v6
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Compute interpreter path
        id: interp
        run: |
          VER="${{ matrix.python-version }}"
          MM=$(echo "$VER" | tr -d '.t')
          echo "path=/opt/python/cp${MM}-cp${MM}t/bin/python3" >> "$GITHUB_OUTPUT"
      - name: Build wheels
        # abi3-py310 doesn't apply on free-threaded; opt out of crate
        # default features and turn `python` on explicitly. Matches the
        # tests-matrix `linux-py3.13t` row and the previous GitHub
        # free-threaded job.
        run: |
          /opt/python/cp312-cp312/bin/pip install maturin
          /opt/python/cp312-cp312/bin/maturin build --release --out dist \
            --interpreter ${{ steps.interp.outputs.path }} \
            --manylinux 2_28 --target ${{ matrix.target }}-unknown-linux-gnu \
            --no-default-features --features python
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wheels-linux-freethreaded-${{ matrix.python-version }}-${{ matrix.target }}
          path: dist
          retention-days: 1

  windows:
    name: Python Windows builds
    if: startsWith(forge.ref, 'refs/tags/') || inputs.build_wheels == 'true'
    needs: [tests, tests-matrix, lint]
    runs-on: windows
    env:
      UV_CACHE_DIR: .uv-cache
      UV_MANAGED_PYTHON: "1"
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: https://github.com/actions/checkout@v6
      - name: Configure persistent cargo cache
        # Windows runs natively on the host (no container, so the
        # equiconc-cargo volumes used by the Linux jobs don't apply).
        # Point CARGO_HOME / CARGO_TARGET_DIR at a path under the
        # runner user's profile so the cargo registry index, downloaded
        # crates, and incremental build artifacts persist across jobs.
        shell: pwsh
        run: |
          $cacheRoot = Join-Path $env:USERPROFILE ".equiconc-cache"
          $cargoHome = Join-Path $cacheRoot "cargo"
          $targetDir = Join-Path $cacheRoot "cargo-target"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          "CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_TARGET_DIR=$targetDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Rust
        shell: pwsh
        run: |
          $rustup = Join-Path ([System.IO.Path]::GetTempPath()) "rustup-init.exe"
          Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile $rustup
          & $rustup --default-toolchain stable --profile minimal --no-modify-path -y
          "$env:CARGO_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v7
      - name: Install Python interpreters
        shell: pwsh
        run: uv python install 3.10 3.11 3.12 3.13 3.14
      - name: Build wheels
        shell: pwsh
        run: |
          $pythons = @("3.10", "3.11", "3.12", "3.13", "3.14") | ForEach-Object { uv python find $_ }
          uvx maturin build --release --out dist --interpreter $pythons
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist
          retention-days: 1

  windows-freethreaded:
    name: Python Windows free-threaded builds
    if: startsWith(forge.ref, 'refs/tags/') || inputs.build_wheels == 'true'
    needs: [tests, tests-matrix, lint]
    runs-on: windows
    env:
      UV_CACHE_DIR: .uv-cache
      UV_MANAGED_PYTHON: "1"
    strategy:
      matrix:
        target: [x64]
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: https://github.com/actions/checkout@v6
      - name: Configure persistent cargo cache
        shell: pwsh
        run: |
          $cacheRoot = Join-Path $env:USERPROFILE ".equiconc-cache"
          $cargoHome = Join-Path $cacheRoot "cargo"
          $targetDir = Join-Path $cacheRoot "cargo-target"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          "CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_TARGET_DIR=$targetDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Rust
        shell: pwsh
        run: |
          $rustup = Join-Path ([System.IO.Path]::GetTempPath()) "rustup-init.exe"
          Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile $rustup
          & $rustup --default-toolchain stable --profile minimal --no-modify-path -y
          "$env:CARGO_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v7
      - name: Install Python interpreter
        shell: pwsh
        run: uv python install ${{ matrix.python-version }}
      - name: Build wheels
        # Same `--no-default-features --features python` rationale as
        # the linux-freethreaded job.
        shell: pwsh
        run: |
          $python = uv python find ${{ matrix.python-version }}
          uvx maturin build --release --out dist --interpreter $python --no-default-features --features python
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wheels-windows-freethreaded-${{ matrix.python-version }}-${{ matrix.target }}
          path: dist
          retention-days: 1

  # macOS jobs run on the `macos-arm64` self-hosted runner. macOS
  # x86_64 wheels are intentionally deprecated; Intel users install
  # from sdist.
  macos:
    name: Python macOS builds
    if: startsWith(forge.ref, 'refs/tags/') || inputs.build_wheels == 'true'
    needs: [tests, tests-matrix, lint]
    runs-on: macos-arm64
    env:
      UV_CACHE_DIR: .uv-cache
      UV_MANAGED_PYTHON: "1"
    strategy:
      matrix:
        target: [aarch64]
    steps:
      - uses: https://github.com/actions/checkout@v6
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v7
      - name: Install Python interpreters
        run: uv python install 3.10 3.11 3.12 3.13 3.14
      - name: Build wheels
        run: |
          pythons=$(for v in 3.10 3.11 3.12 3.13 3.14; do uv python find "$v"; done)
          uvx maturin build --release --out dist --target ${{ matrix.target }}-apple-darwin --interpreter $pythons
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist
          retention-days: 1

  macos-freethreaded:
    name: Python macOS free-threaded builds
    if: startsWith(forge.ref, 'refs/tags/') || inputs.build_wheels == 'true'
    needs: [tests, tests-matrix, lint]
    runs-on: macos-arm64
    env:
      UV_CACHE_DIR: .uv-cache
      UV_MANAGED_PYTHON: "1"
    strategy:
      matrix:
        target: [aarch64]
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: https://github.com/actions/checkout@v6
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v7
      - name: Install Python interpreter
        run: uv python install ${{ matrix.python-version }}
      - name: Build wheels
        # Same `--no-default-features --features python` rationale as
        # the linux-freethreaded job.
        run: |
          python=$(uv python find ${{ matrix.python-version }})
          uvx maturin build --release --out dist --target ${{ matrix.target }}-apple-darwin --interpreter "$python" --no-default-features --features python
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wheels-macos-freethreaded-${{ matrix.python-version }}-${{ matrix.target }}
          path: dist
          retention-days: 1

  sdist:
    name: Build sdist
    if: startsWith(forge.ref, 'refs/tags/') || inputs.build_wheels == 'true'
    needs: [tests, tests-matrix, lint]
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:22-bookworm
      volumes:
        - equiconc-cargo:/cache/cargo
        - equiconc-cargo-target:/cache/cargo-target
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/cargo-target
    steps:
      - uses: https://github.com/actions/checkout@v6
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Build sdist
        run: uvx maturin sdist --out dist
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist
          retention-days: 1

  # ----- Release publication (tag-only) -----------------------------

  python_release:
    name: Python PyPI release
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:22-bookworm
    if: startsWith(forge.ref, 'refs/tags/')
    needs: [linux, linux-freethreaded, windows, windows-freethreaded, macos, macos-freethreaded, sdist]
    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v7
      - name: Publish to PyPI
        # PyPI trusted publishing currently doesn't support
        # Codeberg/Forgejo OIDC, so we use an API token. Set PYPI_TOKEN
        # as a repo secret.
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/*

  rust_release:
    name: Rust crates.io release
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:22-bookworm
      volumes:
        - equiconc-cargo:/cache/cargo
        - equiconc-cargo-target:/cache/cargo-target
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/cargo-target
    if: startsWith(forge.ref, 'refs/tags/')
    needs: [lint, tests]
    steps:
      - uses: https://github.com/actions/checkout@v6
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p equiconc

  forgejo_release:
    name: Forgejo release
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:22-bookworm
    if: startsWith(forge.ref, 'refs/tags/')
    needs: [linux, linux-freethreaded, windows, windows-freethreaded, macos, macos-freethreaded, sdist]
    permissions:
      contents: write
    steps:
      - uses: https://github.com/actions/checkout@v6
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Extract changelog for this version
        # Keep-a-Changelog style: `## [VERSION] - DATE` headers. Reuse
        # the awk extractor previously used by the GitHub release job.
        run: |
          TAG="${{ forge.ref_name }}"
          VERSION="${TAG#v}"
          NOTES=$(awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              header=$0; sub(/^## \[/, "", header); sub(/\].*/, "", header)
              if (header == ver) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)
          echo "$NOTES" > /tmp/release-notes.md
      - name: Create Forgejo release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ forge.server_url }}
          repo: ${{ forge.repository }}
          tag: ${{ forge.ref_name }}
          title: ${{ forge.ref_name }}
          release-notes-file: /tmp/release-notes.md
          release-dir: dist
          token: ${{ forge.token }}

  # ----- Codeberg Pages deploy --------------------------------------

  pages:
    name: Deploy docs (root) + web app (/app/) to Codeberg Pages
    # Auto-deploys on main and tag pushes. workflow_dispatch (any
    # branch) is allowed as an escape hatch so the Pages plumbing can
    # be smoke-tested from a feature branch without cutting a release;
    # whatever ref was dispatched then becomes the live site until the
    # next main/tag push overwrites it.
    if: |
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/')
    needs: [web, docs, lint]
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:22-bookworm
    steps:
      - name: Download docs site
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: docs-site
          path: site
      - name: Download web app dist
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: web-dist
          path: site/app
      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: "https://${{ forge.repository_owner }}.codeberg.page/equiconc/"
          token: ${{ forge.token }}
          source: site/
