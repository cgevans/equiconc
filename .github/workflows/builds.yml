name: Builds

# Releases (PyPI, crates.io, Forgejo releases, Codeberg Generic Packages)
# are now produced from Codeberg via .forgejo/workflows/builds.yml. This
# workflow only validates pushes/PRs that happen on the GitHub mirror.
# Do not re-add tag triggers or release jobs here without first
# disabling the corresponding Codeberg jobs.

on:
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md
      - README.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust_checks:
    name: Rust checks (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings
      - run: cargo test --lib

  python_checks:
    name: Python checks (maturin develop + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev --no-install-project
      - run: uv run maturin develop --uv --release
      - run: uv run pytest tests/test_equiconc.py -v
